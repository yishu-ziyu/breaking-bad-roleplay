name: Deploy to Railway

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: railway-cli/action@v0.0.5
        with:
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
          service: breaking-bad-roleplay
          project: breaking-bad-roleplay
          detach: false
