<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="gusClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="#6fa66a"/>
  <g clip-path="url(#gusClip)" fill="#b2f09a">
    <!-- Neat suit jacket with clean V neck and well-defined shoulders -->
    <path d="M 30 200 L 30 165 Q 38 144 66 137 L 88 132 L 100 152 L 112 132 L 134 137 Q 162 144 170 165 L 170 200 Z"/>
    <!-- Neck -->
    <rect x="90" y="115" width="20" height="18"/>
    <!-- Narrow tie (vertical tapering shape in V neck opening) -->
    <path d="M 95 134 L 105 134 L 107 148 L 102 168 L 98 168 L 93 148 Z"/>
    <!-- Head (smooth oval, slightly elongated to suggest neat short hair) -->
    <ellipse cx="100" cy="80" rx="30" ry="38"/>
  </g>
  <!-- Thin glasses (subtle horizontal line across eye level) -->
  <rect x="72" y="78" width="56" height="2" fill="#6fa66a"/>
</svg>
