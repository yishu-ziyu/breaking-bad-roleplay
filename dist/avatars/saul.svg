<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="saulClip">
      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="#b8982e"/>
  <g clip-path="url(#saulClip)" fill="#f7ce46">
    <!-- Suit jacket shoulders with V neck -->
    <path d="M 28 200 L 28 168 Q 33 146 60 138 L 82 130 L 100 150 L 118 130 L 140 138 Q 167 146 172 168 L 172 200 Z"/>
    <!-- Neck -->
    <rect x="90" y="116" width="20" height="16"/>
    <!-- Bow tie at neck (two triangles meeting at center, diamond shape) -->
    <path d="M 100 134 L 87 127 L 87 141 Z"/>
    <path d="M 100 134 L 113 127 L 113 141 Z"/>
    <circle cx="100" cy="134" r="2.5"/>
    <!-- Head -->
    <ellipse cx="100" cy="88" rx="30" ry="30"/>
    <!-- Tall pompadour/crest (vertical wave/curl on top) -->
    <path d="M 76 60 Q 70 32 82 22 Q 92 15 102 18 Q 118 18 122 34 Q 128 52 124 60 Q 110 64 100 62 Q 86 64 76 60 Z"/>
    <!-- Thick glasses frame (rectangular, slightly wider than head) -->
    <rect x="62" y="78" width="76" height="14" rx="3"/>
  </g>
  <!-- Glasses lens cutouts (background color) -->
  <rect x="66" y="81" width="28" height="8" rx="1" fill="#b8982e"/>
  <rect x="106" y="81" width="28" height="8" rx="1" fill="#b8982e"/>
</svg>
