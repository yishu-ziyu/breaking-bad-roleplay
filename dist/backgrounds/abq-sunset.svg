<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="abqSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b3d"/>
      <stop offset="0.45" stop-color="#5a2a4a"/>
      <stop offset="0.78" stop-color="#f7ce46"/>
      <stop offset="0.92" stop-color="#d7e36f"/>
      <stop offset="1" stop-color="#1d2612"/>
    </linearGradient>
    <radialGradient id="abqSun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff5b8" stop-opacity="1"/>
      <stop offset="0.4" stop-color="#f7ce46" stop-opacity="0.95"/>
      <stop offset="0.85" stop-color="#f7ce46" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f7ce46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="abqHaze" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d7e36f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5d604c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="abqGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2612"/>
      <stop offset="1" stop-color="#17200e"/>
    </linearGradient>
    <linearGradient id="abqFarMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2540" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1d2612" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="abqNearMtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14200d"/>
      <stop offset="1" stop-color="#0a1206"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="1080" fill="url(#abqSky)"/>

  <!-- Sun glow halo -->
  <circle cx="1100" cy="690" r="520" fill="url(#abqSun)" opacity="0.7"/>

  <!-- Sun disc -->
  <circle cx="1100" cy="690" r="135" fill="#f7ce46" opacity="0.95" stroke="#fff5b8" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Dust haze near horizon -->
  <ellipse cx="960" cy="760" rx="1100" ry="80" fill="url(#abqHaze)"/>

  <!-- Far mountain ridge -->
  <path d="M 0 720 L 120 660 L 240 690 L 360 620 L 480 680 L 620 640 L 760 670 L 900 650 L 1040 700 L 1180 660 L 1320 690 L 1460 650 L 1600 680 L 1740 640 L 1920 670 L 1920 760 L 0 760 Z"
        fill="url(#abqFarMtn)" stroke="#2a1b3d" stroke-width="2" stroke-opacity="0.7"/>

  <!-- Near jagged mountain ridge -->
  <path d="M 0 800 L 80 760 L 180 800 L 300 730 L 420 790 L 560 750 L 700 800 L 840 760 L 980 790 L 1120 770 L 1260 810 L 1400 770 L 1540 800 L 1680 760 L 1820 790 L 1920 770 L 1920 900 L 0 900 Z"
        fill="url(#abqNearMtn)" stroke="#0a1206" stroke-width="2.5"/>

  <!-- Ground -->
  <rect x="0" y="850" width="1920" height="230" fill="url(#abqGround)"/>

  <!-- Saguaro cactus 1 (left foreground) -->
  <g stroke="#0a1206" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 220 1010 L 220 800 Q 220 780 235 780 Q 250 780 250 800 L 250 880
             M 200 870 Q 185 870 185 855 L 185 815 Q 185 805 195 805 Q 205 805 205 815 L 205 870
             M 250 920 Q 265 920 265 905 L 265 855 Q 265 845 275 845 Q 285 845 285 855 L 285 905
             M 235 1010 L 235 1015" fill="#1d2612"/>
    <!-- ribs (vertical lines on cactus) -->
    <line x1="225" y1="810" x2="225" y2="1005" stroke="#0a1206" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="235" y1="810" x2="235" y2="1005" stroke="#0a1206" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="245" y1="810" x2="245" y2="1005" stroke="#0a1206" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Small saguaro right of left one -->
  <g stroke="#0a1206" stroke-width="2" stroke-linejoin="round">
    <path d="M 380 1020 L 380 900 Q 380 890 390 890 Q 400 890 400 900 L 400 1020
             M 380 950 Q 365 950 365 940 L 365 910 Q 365 902 373 902 Q 380 902 380 910
             M 400 940 Q 415 940 415 928 L 415 905 Q 415 898 407 898 Q 400 898 400 905"
          fill="#17200e"/>
  </g>

  <!-- Small bush right of cacti -->
  <g stroke="#0a1206" stroke-width="1.5">
    <ellipse cx="540" cy="990" rx="70" ry="28" fill="#1d2612"/>
    <line x1="490" y1="985" x2="490" y2="1005" stroke="#0a1206" stroke-width="1"/>
    <line x1="520" y1="980" x2="520" y2="1005" stroke="#0a1206" stroke-width="1"/>
    <line x1="555" y1="983" x2="555" y2="1005" stroke="#0a1206" stroke-width="1"/>
    <line x1="585" y1="988" x2="585" y2="1005" stroke="#0a1206" stroke-width="1"/>
  </g>

  <!-- Saguaro cactus 2 (right foreground) -->
  <g stroke="#0a1206" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M 1620 1015 L 1620 760 Q 1620 740 1638 740 Q 1656 740 1656 760 L 1656 860
             M 1620 830 Q 1600 830 1600 815 L 1600 770 Q 1600 760 1612 760 Q 1620 760 1620 770
             M 1656 910 Q 1680 910 1680 895 L 1680 845 Q 1680 835 1690 835 Q 1700 835 1700 845 L 1700 895
             M 1656 880 Q 1680 880 1680 865 L 1680 825 Q 1680 815 1690 815 Q 1700 815 1700 825 L 1700 865"
          fill="#1d2612"/>
    <line x1="1628" y1="775" x2="1628" y2="1010" stroke="#0a1206" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="1638" y1="775" x2="1638" y2="1010" stroke="#0a1206" stroke-width="1" stroke-opacity="0.5"/>
    <line x1="1648" y1="775" x2="1648" y2="1010" stroke="#0a1206" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Small desert shrub right -->
  <g stroke="#0a1206" stroke-width="1.5">
    <ellipse cx="1780" cy="1010" rx="80" ry="22" fill="#17200e"/>
    <line x1="1730" y1="1005" x2="1730" y2="1025" stroke="#0a1206" stroke-width="1"/>
    <line x1="1760" y1="1000" x2="1760" y2="1025" stroke="#0a1206" stroke-width="1"/>
    <line x1="1800" y1="1003" x2="1800" y2="1025" stroke="#0a1206" stroke-width="1"/>
  </g>

  <!-- Ground detail strokes -->
  <g stroke="#0a1206" stroke-width="1" stroke-opacity="0.4" fill="none">
    <line x1="0" y1="900" x2="1920" y2="900"/>
    <line x1="0" y1="940" x2="1920" y2="940"/>
    <line x1="0" y1="990" x2="1920" y2="990"/>
  </g>

  <!-- Dust particles -->
  <g fill="#d7e36f" fill-opacity="0.25">
    <circle cx="320" cy="820" r="2"/>
    <circle cx="580" cy="845" r="1.5"/>
    <circle cx="820" cy="830" r="2"/>
    <circle cx="1280" cy="840" r="1.5"/>
    <circle cx="1500" cy="820" r="2"/>
    <circle cx="1720" cy="845" r="1.5"/>
  </g>
</svg>
