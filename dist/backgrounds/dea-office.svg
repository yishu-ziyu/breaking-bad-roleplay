<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="deaWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4555"/>
      <stop offset="0.5" stop-color="#2a3540"/>
      <stop offset="1" stop-color="#1a2530"/>
    </linearGradient>
    <linearGradient id="deaFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3038"/>
      <stop offset="1" stop-color="#0a1018"/>
    </linearGradient>
    <linearGradient id="deaCeiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3038"/>
      <stop offset="1" stop-color="#1a2530"/>
    </linearGradient>
    <linearGradient id="deaMonitor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93d7ff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#3a5a7a" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="deaMonitorGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#93d7ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#93d7ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="deaLamp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0f4f8" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#aabac8" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <!-- Ceiling -->
  <rect width="1920" height="140" fill="url(#deaCeiling)"/>

  <!-- Back wall -->
  <rect x="0" y="140" width="1920" height="700" fill="url(#deaWall)"/>

  <!-- Floor -->
  <rect x="0" y="840" width="1920" height="240" fill="url(#deaFloor)"/>
  <g stroke="#1a2530" stroke-width="1" stroke-opacity="0.5" fill="none">
    <line x1="240" y1="840" x2="240" y2="1080"/>
    <line x1="480" y1="840" x2="480" y2="1080"/>
    <line x1="720" y1="840" x2="720" y2="1080"/>
    <line x1="960" y1="840" x2="960" y2="1080"/>
    <line x1="1200" y1="840" x2="1200" y2="1080"/>
    <line x1="1440" y1="840" x2="1440" y2="1080"/>
    <line x1="1680" y1="840" x2="1680" y2="1080"/>
  </g>

  <!-- Fluorescent ceiling light strips -->
  <g>
    <!-- Light 1 -->
    <rect x="100" y="50" width="700" height="40" fill="url(#deaLamp)" stroke="#3a4555" stroke-width="2"/>
    <rect x="120" y="60" width="660" height="20" fill="#ffffff" opacity="0.9"/>
    <rect x="100" y="90" width="700" height="6" fill="#1a2530"/>
    <!-- glow under light -->
    <ellipse cx="450" cy="200" rx="500" ry="80" fill="#f0f4f8" opacity="0.08"/>

    <!-- Light 2 -->
    <rect x="1120" y="50" width="700" height="40" fill="url(#deaLamp)" stroke="#3a4555" stroke-width="2"/>
    <rect x="1140" y="60" width="660" height="20" fill="#ffffff" opacity="0.9"/>
    <rect x="1120" y="90" width="700" height="6" fill="#1a2530"/>
    <ellipse cx="1470" cy="200" rx="500" ry="80" fill="#f0f4f8" opacity="0.08"/>
  </g>

  <!-- Wall trim (chair rail) -->
  <line x1="0" y1="640" x2="1920" y2="640" stroke="#1a2530" stroke-width="3"/>
  <line x1="0" y1="650" x2="1920" y2="650" stroke="#4a5565" stroke-width="1"/>

  <!-- Wall baseboard -->
  <rect x="0" y="820" width="1920" height="20" fill="#0a1018"/>

  <!-- Badge / seal shape on back wall (center, no text) -->
  <g>
    <!-- outer star shape -->
    <path d="M 960 280
             L 988 360 L 1072 360
             L 1004 410 L 1030 492
             L 960 444 L 890 492
             L 916 410 L 848 360
             L 932 360 Z"
          fill="#3a4555" stroke="#0a1018" stroke-width="3" stroke-linejoin="round"/>
    <!-- inner circle -->
    <circle cx="960" cy="408" r="60" fill="#2a3540" stroke="#0a1018" stroke-width="2.5"/>
    <!-- inner star detail (smaller) -->
    <path d="M 960 380
             L 970 408 L 998 408
             L 977 425 L 985 452
             L 960 437 L 935 452
             L 943 425 L 922 408
             L 950 408 Z"
          fill="#3a4555" stroke="#0a1018" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- decorative banner shape under badge (no text) -->
    <path d="M 880 540 L 1040 540 L 1020 580 L 900 580 Z" fill="#2a3540" stroke="#0a1018" stroke-width="2"/>
  </g>

  <!-- Bulletin board (left) -->
  <g stroke="#0a1018" stroke-width="2">
    <rect x="100" y="280" width="280" height="200" fill="#4a3528" stroke-width="3"/>
    <rect x="115" y="295" width="250" height="170" fill="#6a4a38"/>
    <!-- pinned papers (no readable text) -->
    <rect x="130" y="310" width="60" height="50" fill="#e8d8b8"/>
    <rect x="200" y="320" width="60" height="50" fill="#e8d8b8"/>
    <rect x="270" y="310" width="60" height="50" fill="#e8d8b8"/>
    <rect x="160" y="380" width="60" height="50" fill="#e8d8b8"/>
    <rect x="230" y="380" width="60" height="50" fill="#e8d8b8"/>
    <circle cx="160" cy="320" r="2" fill="#0a1018"/>
    <circle cx="230" cy="330" r="2" fill="#0a1018"/>
    <circle cx="300" cy="320" r="2" fill="#0a1018"/>
    <circle cx="190" cy="390" r="2" fill="#0a1018"/>
    <circle cx="260" cy="390" r="2" fill="#0a1018"/>
  </g>

  <!-- Filing cabinet (right) -->
  <g stroke="#0a1018" stroke-width="2.5">
    <rect x="1560" y="380" width="180" height="280" fill="#5a6575"/>
    <rect x="1560" y="380" width="180" height="280" fill="none"/>
    <rect x="1575" y="400" width="150" height="70" fill="#4a5565"/>
    <rect x="1575" y="485" width="150" height="70" fill="#4a5565"/>
    <rect x="1575" y="570" width="150" height="70" fill="#4a5565"/>
    <rect x="1640" y="430" width="20" height="8" fill="#1a2530"/>
    <rect x="1640" y="515" width="20" height="8" fill="#1a2530"/>
    <rect x="1640" y="600" width="20" height="8" fill="#1a2530"/>
  </g>

  <!-- Wall clock (left of badge) -->
  <g stroke="#0a1018" stroke-width="2.5">
    <circle cx="600" cy="380" r="55" fill="#1a2530"/>
    <circle cx="600" cy="380" r="50" fill="#2a3540"/>
    <line x1="600" y1="380" x2="600" y2="345" stroke="#f0f4f8" stroke-width="2"/>
    <line x1="600" y1="380" x2="625" y2="380" stroke="#f0f4f8" stroke-width="2"/>
    <circle cx="600" cy="380" r="3" fill="#f0f4f8"/>
  </g>

  <!-- American flag silhouette (right of badge, no text/stars) -->
  <g>
    <rect x="1280" y="280" width="220" height="140" fill="#0a1018" stroke="#1a2530" stroke-width="2"/>
    <rect x="1290" y="290" width="60" height="60" fill="#2a4555"/>
    <rect x="1360" y="290" width="130" height="14" fill="#8a3030" opacity="0.7"/>
    <rect x="1360" y="320" width="130" height="14" fill="#8a3030" opacity="0.7"/>
    <rect x="1360" y="350" width="130" height="14" fill="#8a3030" opacity="0.7"/>
  </g>

  <!-- Desk silhouette (foreground) -->
  <g stroke="#0a1018" stroke-width="2.5" stroke-linejoin="round">
    <rect x="200" y="640" width="1520" height="30" fill="#3a2a18"/>
    <rect x="220" y="670" width="1480" height="200" fill="#2a1810"/>
    <rect x="220" y="670" width="1480" height="6" fill="#4a3528"/>
    <line x1="220" y1="870" x2="220" y2="1080" stroke="#0a1018" stroke-width="3"/>
    <line x1="1700" y1="870" x2="1700" y2="1080" stroke="#0a1018" stroke-width="3"/>
  </g>

  <!-- Computer monitor on desk (center) with blue glow -->
  <g>
    <ellipse cx="960" cy="600" rx="200" ry="120" fill="url(#deaMonitorGlow)"/>
    <rect x="900" y="540" width="200" height="140" fill="#0a1018" stroke="#0a1018" stroke-width="3" rx="6"/>
    <rect x="912" y="552" width="176" height="116" fill="url(#deaMonitor)" rx="2"/>
    <!-- Screen content lines (no readable text) -->
    <g stroke="#1a2530" stroke-width="1.5" stroke-opacity="0.6">
      <line x1="920" y1="568" x2="1000" y2="568"/>
      <line x1="920" y1="582" x2="1080" y2="582"/>
      <line x1="920" y1="596" x2="1050" y2="596"/>
      <line x1="920" y1="610" x2="1070" y2="610"/>
      <line x1="920" y1="624" x2="1020" y2="624"/>
      <line x1="920" y1="638" x2="1060" y2="638"/>
      <line x1="920" y1="652" x2="990" y2="652"/>
    </g>
    <!-- monitor stand -->
    <rect x="980" y="680" width="40" height="14" fill="#0a1018"/>
    <rect x="940" y="694" width="120" height="8" fill="#0a1018"/>
  </g>

  <!-- Keyboard silhouette -->
  <rect x="900" y="710" width="200" height="20" fill="#0a1018" stroke="#0a1018" stroke-width="1.5" rx="3"/>
  <line x1="910" y1="720" x2="1090" y2="720" stroke="#2a3540" stroke-width="1"/>

  <!-- Desk items left of monitor -->
  <g stroke="#0a1018" stroke-width="2">
    <!-- paper stack -->
    <rect x="300" y="700" width="120" height="80" fill="#e8d8b8"/>
    <rect x="310" y="710" width="120" height="80" fill="#e8d8b8"/>
    <rect x="320" y="720" width="120" height="80" fill="#e8d8b8"/>
    <!-- coffee mug -->
    <ellipse cx="540" cy="745" rx="28" ry="10" fill="#1a2530"/>
    <path d="M 520 745 Q 510 745 510 730 L 510 705 Q 510 695 520 695 L 560 695 Q 570 695 570 705 L 570 730 Q 570 745 560 745" fill="#2a3540"/>
    <path d="M 570 720 Q 590 720 590 730 Q 590 740 570 740" fill="none" stroke="#0a1018" stroke-width="2"/>
  </g>

  <!-- Desk items right of monitor -->
  <g stroke="#0a1018" stroke-width="2">
    <!-- pen holder -->
    <rect x="1300" y="700" width="40" height="80" fill="#2a3540"/>
    <line x1="1308" y1="700" x2="1308" y2="660" stroke="#0a1018" stroke-width="2"/>
    <line x1="1318" y1="700" x2="1318" y2="650" stroke="#0a1018" stroke-width="2"/>
    <line x1="1330" y1="700" x2="1330" y2="665" stroke="#0a1018" stroke-width="2"/>
    <!-- phone -->
    <rect x="1380" y="720" width="120" height="60" fill="#0a1018"/>
    <rect x="1390" y="730" width="100" height="40" fill="#1a2530"/>
    <line x1="1430" y1="750" x2="1450" y2="750" stroke="#0a1018" stroke-width="2"/>
    <circle cx="1395" cy="735" r="2" fill="#93d7ff" opacity="0.7"/>
    <circle cx="1395" cy="765" r="2" fill="#93d7ff" opacity="0.7"/>
  </g>

  <!-- Office chair (center, behind desk) -->
  <g stroke="#0a1018" stroke-width="2.5" stroke-linejoin="round">
    <rect x="850" y="780" width="220" height="100" fill="#1a2530" rx="8"/>
    <line x1="850" y1="800" x2="1070" y2="800" stroke="#2a3540" stroke-width="2"/>
    <line x1="960" y1="880" x2="960" y2="1000" stroke="#0a1018" stroke-width="6"/>
    <ellipse cx="960" cy="1010" rx="100" ry="14" fill="#0a1018"/>
  </g>

  <!-- Wall vent (top right) -->
  <g stroke="#0a1018" stroke-width="2">
    <rect x="1700" y="180" width="120" height="80" fill="#2a3540"/>
    <line x1="1710" y1="195" x2="1810" y2="195" stroke="#0a1018"/>
    <line x1="1710" y1="210" x2="1810" y2="210" stroke="#0a1018"/>
    <line x1="1710" y1="225" x2="1810" y2="225" stroke="#0a1018"/>
    <line x1="1710" y1="240" x2="1810" y2="240" stroke="#0a1018"/>
  </g>
</svg>
