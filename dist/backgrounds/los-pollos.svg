<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lpCeiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="lpWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a2a"/>
      <stop offset="0.6" stop-color="#2a2818"/>
      <stop offset="1" stop-color="#1a1810"/>
    </linearGradient>
    <radialGradient id="lpLampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ce46" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#f7ce46" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f7ce46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lpFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2618"/>
      <stop offset="1" stop-color="#0a0808"/>
    </linearGradient>
    <linearGradient id="lpCounter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3530"/>
      <stop offset="1" stop-color="#1a1818"/>
    </linearGradient>
  </defs>

  <!-- Ceiling -->
  <rect width="1920" height="160" fill="url(#lpCeiling)"/>

  <!-- Back wall -->
  <rect x="0" y="160" width="1920" height="700" fill="url(#lpWall)"/>

  <!-- Floor -->
  <rect x="0" y="860" width="1920" height="220" fill="url(#lpFloor)"/>
  <g stroke="#1a1810" stroke-width="1" fill="none" stroke-opacity="0.6">
    <line x1="240" y1="860" x2="240" y2="1080"/>
    <line x1="480" y1="860" x2="480" y2="1080"/>
    <line x1="720" y1="860" x2="720" y2="1080"/>
    <line x1="960" y1="860" x2="960" y2="1080"/>
    <line x1="1200" y1="860" x2="1200" y2="1080"/>
    <line x1="1440" y1="860" x2="1440" y2="1080"/>
    <line x1="1680" y1="860" x2="1680" y2="1080"/>
  </g>

  <!-- Hanging pendant lamps (warm light) -->
  <g>
    <!-- Lamp 1 (left) -->
    <line x1="280" y1="160" x2="280" y2="220" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="280" cy="240" rx="60" ry="22" fill="#2a1818" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="280" cy="248" rx="55" ry="14" fill="#f7ce46" opacity="0.95"/>
    <ellipse cx="280" cy="248" rx="180" ry="80" fill="url(#lpLampGlow)"/>

    <!-- Lamp 2 (mid-left) -->
    <line x1="600" y1="160" x2="600" y2="220" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="600" cy="240" rx="60" ry="22" fill="#2a1818" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="600" cy="248" rx="55" ry="14" fill="#f7ce46" opacity="0.95"/>
    <ellipse cx="600" cy="248" rx="180" ry="80" fill="url(#lpLampGlow)"/>

    <!-- Lamp 3 (mid-right) -->
    <line x1="1320" y1="160" x2="1320" y2="220" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="1320" cy="240" rx="60" ry="22" fill="#2a1818" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="1320" cy="248" rx="55" ry="14" fill="#f7ce46" opacity="0.95"/>
    <ellipse cx="1320" cy="248" rx="180" ry="80" fill="url(#lpLampGlow)"/>

    <!-- Lamp 4 (right) -->
    <line x1="1640" y1="160" x2="1640" y2="220" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="1640" cy="240" rx="60" ry="22" fill="#2a1818" stroke="#0a0808" stroke-width="2"/>
    <ellipse cx="1640" cy="248" rx="55" ry="14" fill="#f7ce46" opacity="0.95"/>
    <ellipse cx="1640" cy="248" rx="180" ry="80" fill="url(#lpLampGlow)"/>
  </g>

  <!-- Background uniforms hanging (yellow + teal stripes pattern) -->
  <g>
    <!-- uniform 1 (left) -->
    <rect x="120" y="380" width="80" height="280" fill="#1a1810" stroke="#0a0808" stroke-width="2"/>
    <g>
      <rect x="120" y="380" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="120" y="410" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="120" y="430" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="120" y="460" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="120" y="480" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="120" y="510" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="120" y="530" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="120" y="560" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="120" y="580" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="120" y="610" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="120" y="630" width="80" height="30" fill="#f7ce46" opacity="0.85"/>
    </g>
    <line x1="160" y1="360" x2="160" y2="380" stroke="#0a0808" stroke-width="2"/>
    <line x1="120" y1="380" x2="160" y2="360" stroke="#0a0808" stroke-width="2"/>
    <line x1="200" y1="380" x2="160" y2="360" stroke="#0a0808" stroke-width="2"/>

    <!-- uniform 2 -->
    <rect x="240" y="380" width="80" height="280" fill="#1a1810" stroke="#0a0808" stroke-width="2"/>
    <g>
      <rect x="240" y="380" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="240" y="410" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="240" y="430" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="240" y="460" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="240" y="480" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="240" y="510" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="240" y="530" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="240" y="560" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="240" y="580" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="240" y="610" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="240" y="630" width="80" height="30" fill="#f7ce46" opacity="0.85"/>
    </g>
    <line x1="280" y1="360" x2="280" y2="380" stroke="#0a0808" stroke-width="2"/>
    <line x1="240" y1="380" x2="280" y2="360" stroke="#0a0808" stroke-width="2"/>
    <line x1="320" y1="380" x2="280" y2="360" stroke="#0a0808" stroke-width="2"/>

    <!-- uniform 3 (right) -->
    <rect x="1600" y="380" width="80" height="280" fill="#1a1810" stroke="#0a0808" stroke-width="2"/>
    <g>
      <rect x="1600" y="380" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1600" y="410" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1600" y="430" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1600" y="460" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1600" y="480" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1600" y="510" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1600" y="530" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1600" y="560" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1600" y="580" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1600" y="610" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1600" y="630" width="80" height="30" fill="#f7ce46" opacity="0.85"/>
    </g>
    <line x1="1640" y1="360" x2="1640" y2="380" stroke="#0a0808" stroke-width="2"/>
    <line x1="1600" y1="380" x2="1640" y2="360" stroke="#0a0808" stroke-width="2"/>
    <line x1="1680" y1="380" x2="1640" y2="360" stroke="#0a0808" stroke-width="2"/>

    <!-- uniform 4 -->
    <rect x="1720" y="380" width="80" height="280" fill="#1a1810" stroke="#0a0808" stroke-width="2"/>
    <g>
      <rect x="1720" y="380" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1720" y="410" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1720" y="430" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1720" y="460" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1720" y="480" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1720" y="510" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1720" y="530" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1720" y="560" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1720" y="580" width="80" height="22" fill="#f7ce46" opacity="0.85"/>
      <rect x="1720" y="610" width="80" height="14" fill="#1a4a4a" opacity="0.8"/>
      <rect x="1720" y="630" width="80" height="30" fill="#f7ce46" opacity="0.85"/>
    </g>
    <line x1="1760" y1="360" x2="1760" y2="380" stroke="#0a0808" stroke-width="2"/>
    <line x1="1720" y1="380" x2="1760" y2="360" stroke="#0a0808" stroke-width="2"/>
    <line x1="1800" y1="380" x2="1760" y2="360" stroke="#0a0808" stroke-width="2"/>
  </g>

  <!-- Range hood / vent (center back wall) -->
  <g stroke="#0a0808" stroke-width="2.5">
    <rect x="780" y="180" width="360" height="100" fill="#1a1810"/>
    <line x1="800" y1="200" x2="1120" y2="200" stroke="#0a0808" stroke-width="1.5"/>
    <line x1="800" y1="220" x2="1120" y2="220" stroke="#0a0808" stroke-width="1.5"/>
    <line x1="800" y1="240" x2="1120" y2="240" stroke="#0a0808" stroke-width="1.5"/>
    <line x1="800" y1="260" x2="1120" y2="260" stroke="#0a0808" stroke-width="1.5"/>
  </g>

  <!-- Stainless steel backsplash area behind range -->
  <rect x="760" y="280" width="400" height="280" fill="#3a3530" stroke="#0a0808" stroke-width="2" opacity="0.6"/>

  <!-- Stove / range -->
  <g stroke="#0a0808" stroke-width="2.5">
    <rect x="800" y="560" width="320" height="120" fill="#1a1810"/>
    <!-- burners -->
    <circle cx="870" cy="600" r="28" fill="#0a0808"/>
    <circle cx="870" cy="600" r="20" fill="#1a1810"/>
    <circle cx="1050" cy="600" r="28" fill="#0a0808"/>
    <circle cx="1050" cy="600" r="20" fill="#1a1810"/>
    <circle cx="870" cy="650" r="20" fill="#0a0808"/>
    <circle cx="1050" cy="650" r="20" fill="#0a0808"/>
    <!-- knobs -->
    <circle cx="820" cy="668" r="5" fill="#f7ce46" opacity="0.6"/>
    <circle cx="850" cy="668" r="5" fill="#f7ce46" opacity="0.6"/>
    <circle cx="1070" cy="668" r="5" fill="#f7ce46" opacity="0.6"/>
    <circle cx="1100" cy="668" r="5" fill="#f7ce46" opacity="0.6"/>
  </g>

  <!-- Counter -->
  <rect x="0" y="700" width="1920" height="80" fill="url(#lpCounter)" stroke="#0a0808" stroke-width="2.5"/>

  <!-- Counter equipment silhouettes -->
  <g stroke="#0a0808" stroke-width="2">
    <!-- Left: deep fryer -->
    <rect x="80" y="600" width="200" height="100" fill="#1a1810"/>
    <rect x="100" y="620" width="70" height="60" fill="#0a0808"/>
    <rect x="190" y="620" width="70" height="60" fill="#0a0808"/>
    <line x1="80" y1="610" x2="280" y2="610" stroke="#0a0808" stroke-width="1.5"/>
    <!-- Frying baskets handles -->
    <line x1="100" y1="640" x2="170" y2="640" stroke="#3a3530" stroke-width="3"/>
    <line x1="190" y1="640" x2="260" y2="640" stroke="#3a3530" stroke-width="3"/>

    <!-- Center-left: prep table -->
    <rect x="380" y="640" width="280" height="60" fill="#1a1810"/>
    <line x1="380" y1="650" x2="660" y2="650" stroke="#3a3530" stroke-width="1.5"/>
    <!-- Cutting board -->
    <rect x="430" y="615" width="180" height="25" fill="#3a2818" stroke="#0a0808" stroke-width="1.5"/>

    <!-- Center-right: prep area with containers -->
    <rect x="1240" y="640" width="280" height="60" fill="#1a1810"/>
    <line x1="1240" y1="650" x2="1520" y2="650" stroke="#3a3530" stroke-width="1.5"/>
    <rect x="1290" y="600" width="60" height="40" fill="#1a1810" stroke="#0a0808" stroke-width="1.5"/>
    <rect x="1370" y="595" width="50" height="45" fill="#1a1810" stroke="#0a0808" stroke-width="1.5"/>
    <rect x="1440" y="610" width="55" height="30" fill="#1a1810" stroke="#0a0808" stroke-width="1.5"/>

    <!-- Right: beverage dispenser / register -->
    <rect x="1640" y="600" width="200" height="100" fill="#1a1810"/>
    <rect x="1660" y="620" width="160" height="60" fill="#0a0808"/>
    <rect x="1680" y="640" width="120" height="25" fill="#f7ce46" opacity="0.4"/>
  </g>

  <!-- Wall menu boards (top, no text, just blank yellow shapes) -->
  <g stroke="#0a0808" stroke-width="2.5">
    <rect x="420" y="320" width="240" height="140" fill="#1a1810"/>
    <rect x="440" y="340" width="200" height="100" fill="#f7ce46" opacity="0.55"/>
    <rect x="1260" y="320" width="240" height="140" fill="#1a1810"/>
    <rect x="1280" y="340" width="200" height="100" fill="#f7ce46" opacity="0.55"/>
  </g>

  <!-- Counter stools (foreground silhouettes) -->
  <g stroke="#0a0808" stroke-width="2" fill="#0a0808">
    <rect x="500" y="800" width="50" height="50" rx="4"/>
    <line x1="510" y1="850" x2="510" y2="1010" stroke-width="3"/>
    <line x1="540" y1="850" x2="540" y2="1010" stroke-width="3"/>
    <ellipse cx="525" cy="1015" rx="30" ry="6"/>

    <rect x="760" y="800" width="50" height="50" rx="4"/>
    <line x1="770" y1="850" x2="770" y2="1010" stroke-width="3"/>
    <line x1="800" y1="850" x2="800" y2="1010" stroke-width="3"/>
    <ellipse cx="785" cy="1015" rx="30" ry="6"/>

    <rect x="1080" y="800" width="50" height="50" rx="4"/>
    <line x1="1090" y1="850" x2="1090" y2="1010" stroke-width="3"/>
    <line x1="1120" y1="850" x2="1120" y2="1010" stroke-width="3"/>
    <ellipse cx="1105" cy="1015" rx="30" ry="6"/>

    <rect x="1360" y="800" width="50" height="50" rx="4"/>
    <line x1="1370" y1="850" x2="1370" y2="1010" stroke-width="3"/>
    <line x1="1400" y1="850" x2="1400" y2="1010" stroke-width="3"/>
    <ellipse cx="1385" cy="1015" rx="30" ry="6"/>
  </g>
</svg>
