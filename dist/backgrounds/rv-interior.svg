<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="rvCeiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="rvWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4030"/>
      <stop offset="0.5" stop-color="#3a2f20"/>
      <stop offset="1" stop-color="#2a1f15"/>
    </linearGradient>
    <linearGradient id="rvWindshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0a18"/>
      <stop offset="0.5" stop-color="#1a1a2a"/>
      <stop offset="1" stop-color="#2a2a3a"/>
    </linearGradient>
    <radialGradient id="rvCabLight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ce46" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#f7ce46" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#f7ce46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rvDashboard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2018"/>
      <stop offset="1" stop-color="#0a0805"/>
    </linearGradient>
  </defs>

  <!-- RV ceiling (interior) -->
  <path d="M 0 0 L 1920 0 L 1920 220 L 960 320 L 0 220 Z" fill="url(#rvCeiling)"/>

  <!-- Cab overhead light glow -->
  <ellipse cx="960" cy="180" rx="500" ry="180" fill="url(#rvCabLight)"/>

  <!-- Windshield (large, front of RV) -->
  <g>
    <!-- Outer frame -->
    <path d="M 240 220 L 1680 220 L 1720 720 L 200 720 Z" fill="#1a1410" stroke="#0a0805" stroke-width="3"/>
    <!-- Windshield glass -->
    <path d="M 280 240 L 1640 240 L 1670 700 L 250 700 Z" fill="url(#rvWindshield)"/>
    <!-- Center divider post -->
    <rect x="950" y="240" width="20" height="460" fill="#0a0805"/>
    <!-- Subtle reflection lines -->
    <line x1="350" y1="280" x2="500" y2="280" stroke="#3a3a4a" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="1050" y1="280" x2="1200" y2="280" stroke="#3a3a4a" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="350" y1="660" x2="500" y2="660" stroke="#3a3a4a" stroke-width="1" stroke-opacity="0.2"/>
  </g>

  <!-- Distant light through windshield (single yellow point in darkness) -->
  <g>
    <circle cx="1380" cy="580" r="40" fill="#f7ce46" opacity="0.25"/>
    <circle cx="1380" cy="580" r="15" fill="#f7ce46" opacity="0.6"/>
    <circle cx="1380" cy="580" r="6" fill="#fff5b8"/>
  </g>

  <!-- Faint desert silhouette visible through windshield (very dark) -->
  <g stroke="#1a1a2a" stroke-width="1.5" fill="none" stroke-opacity="0.6">
    <path d="M 250 700 L 280 660 L 320 680 L 380 640 L 450 670 L 540 645 L 640 675 L 740 655 L 840 680 L 940 660 L 1040 685 L 1140 660 L 1240 680 L 1340 655 L 1440 680 L 1540 660 L 1640 675 L 1670 685"/>
  </g>
  <line x1="250" y1="700" x2="1670" y2="700" stroke="#0a0a18" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Side walls (interior of RV) -->
  <rect x="0" y="220" width="240" height="600" fill="url(#rvWall)"/>
  <rect x="1680" y="220" width="240" height="600" fill="url(#rvWall)"/>

  <!-- Wall panel lines -->
  <line x1="0" y1="320" x2="240" y2="320" stroke="#0a0805" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="0" y1="540" x2="240" y2="540" stroke="#0a0805" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="1680" y1="320" x2="1920" y2="320" stroke="#0a0805" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="1680" y1="540" x2="1920" y2="540" stroke="#0a0805" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Window (left side wall) -->
  <g stroke="#0a0805" stroke-width="2.5">
    <rect x="40" y="380" width="160" height="120" fill="#0a0a18"/>
    <line x1="40" y1="440" x2="200" y2="440" stroke="#0a0805" stroke-width="1.5"/>
    <line x1="120" y1="380" x2="120" y2="500" stroke="#0a0805" stroke-width="1.5"/>
    <!-- blinds (drawn) -->
    <line x1="45" y1="395" x2="195" y2="395" stroke="#2a1f15" stroke-width="1"/>
    <line x1="45" y1="410" x2="195" y2="410" stroke="#2a1f15" stroke-width="1"/>
    <line x1="45" y1="425" x2="195" y2="425" stroke="#2a1f15" stroke-width="1"/>
  </g>

  <!-- Window (right side wall) -->
  <g stroke="#0a0805" stroke-width="2.5">
    <rect x="1720" y="380" width="160" height="120" fill="#0a0a18"/>
    <line x1="1720" y1="440" x2="1880" y2="440" stroke="#0a0805" stroke-width="1.5"/>
    <line x1="1800" y1="380" x2="1800" y2="500" stroke="#0a0805" stroke-width="1.5"/>
    <line x1="1725" y1="395" x2="1875" y2="395" stroke="#2a1f15" stroke-width="1"/>
    <line x1="1725" y1="410" x2="1875" y2="410" stroke="#2a1f15" stroke-width="1"/>
    <line x1="1725" y1="425" x2="1875" y2="425" stroke="#2a1f15" stroke-width="1"/>
  </g>

  <!-- Cab overhead light fixture (visible) -->
  <g stroke="#0a0805" stroke-width="2">
    <rect x="900" y="200" width="120" height="20" fill="#2a2018"/>
    <rect x="910" y="218" width="100" height="8" fill="#f7ce46" opacity="0.9"/>
    <rect x="910" y="218" width="100" height="3" fill="#fff5b8"/>
  </g>

  <!-- Sun visor (left and right) -->
  <path d="M 260 240 L 460 240 L 480 290 L 260 290 Z" fill="#2a1f15" stroke="#0a0805" stroke-width="2"/>
  <path d="M 1460 240 L 1660 240 L 1660 290 L 1440 290 Z" fill="#2a1f15" stroke="#0a0805" stroke-width="2"/>

  <!-- Dashboard (foreground) -->
  <g stroke="#0a0805" stroke-width="2.5" stroke-linejoin="round">
    <path d="M 0 800 L 1920 800 L 1920 1080 L 0 1080 Z" fill="url(#rvDashboard)"/>
    <!-- Dashboard top edge -->
    <path d="M 0 800 L 1920 800 L 1900 850 L 20 850 Z" fill="#3a2818"/>
    <line x1="0" y1="800" x2="1920" y2="800" stroke="#5d604c" stroke-width="1" stroke-opacity="0.5"/>
  </g>

  <!-- Steering wheel (left) -->
  <g stroke="#0a0805" stroke-width="3" fill="none">
    <circle cx="380" cy="850" r="80" fill="#0a0805"/>
    <circle cx="380" cy="850" r="65" fill="#1a1410"/>
    <circle cx="380" cy="850" r="12" fill="#0a0805"/>
    <line x1="320" y1="850" x2="440" y2="850" stroke="#0a0805" stroke-width="4"/>
    <line x1="380" y1="790" x2="380" y2="910" stroke="#0a0805" stroke-width="4"/>
  </g>

  <!-- Steering column -->
  <rect x="365" y="800" width="30" height="50" fill="#1a1410" stroke="#0a0805" stroke-width="2"/>

  <!-- Instrument cluster (behind steering wheel) -->
  <g stroke="#0a0805" stroke-width="2">
    <path d="M 240 740 L 520 740 L 530 790 L 230 790 Z" fill="#0a0805"/>
    <circle cx="320" cy="765" r="20" fill="#1a2530" stroke="#93d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <circle cx="430" cy="765" r="20" fill="#1a2530" stroke="#93d7ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- glow on gauges -->
    <circle cx="320" cy="765" r="4" fill="#93d7ff" opacity="0.8"/>
    <circle cx="430" cy="765" r="4" fill="#93d7ff" opacity="0.8"/>
    <line x1="320" y1="765" x2="335" y2="755" stroke="#93d7ff" stroke-width="1.5"/>
    <line x1="430" y1="765" x2="445" y2="775" stroke="#93d7ff" stroke-width="1.5"/>
  </g>

  <!-- Center console (radio/controls) -->
  <g stroke="#0a0805" stroke-width="2">
    <rect x="800" y="780" width="320" height="80" fill="#1a1410"/>
    <rect x="820" y="800" width="280" height="40" fill="#0a0805"/>
    <!-- radio display -->
    <rect x="830" y="808" width="260" height="24" fill="#1a2530"/>
    <text x="0" y="0" fill="none"></text>
    <!-- frequency line -->
    <line x1="850" y1="820" x2="900" y2="820" stroke="#93d7ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="950" y1="820" x2="1000" y2="820" stroke="#93d7ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="1050" y1="820" x2="1080" y2="820" stroke="#93d7ff" stroke-width="1.5" opacity="0.8"/>
    <!-- knobs -->
    <circle cx="850" cy="855" r="8" fill="#0a0805"/>
    <circle cx="890" cy="855" r="8" fill="#0a0805"/>
    <circle cx="1030" cy="855" r="8" fill="#0a0805"/>
    <circle cx="1070" cy="855" r="8" fill="#0a0805"/>
  </g>

  <!-- Passenger side dashboard details -->
  <g stroke="#0a0805" stroke-width="2">
    <rect x="1400" y="780" width="280" height="80" fill="#1a1410"/>
    <rect x="1420" y="800" width="240" height="50" fill="#0a0805"/>
    <!-- air vents -->
    <rect x="1450" y="810" width="80" height="30" fill="#1a1410"/>
    <line x1="1460" y1="820" x2="1520" y2="820" stroke="#3a3530" stroke-width="1"/>
    <line x1="1460" y1="828" x2="1520" y2="828" stroke="#3a3530" stroke-width="1"/>
    <line x1="1460" y1="836" x2="1520" y2="836" stroke="#3a3530" stroke-width="1"/>
    <rect x="1560" y="810" width="80" height="30" fill="#1a1410"/>
    <line x1="1570" y1="820" x2="1630" y2="820" stroke="#3a3530" stroke-width="1"/>
    <line x1="1570" y1="828" x2="1630" y2="828" stroke="#3a3530" stroke-width="1"/>
    <line x1="1570" y1="836" x2="1630" y2="836" stroke="#3a3530" stroke-width="1"/>
  </g>

  <!-- Steering column second part -->
  <rect x="365" y="800" width="30" height="120" fill="#1a1410" stroke="#0a0805" stroke-width="2"/>

  <!-- Rearview mirror -->
  <line x1="960" y1="220" x2="960" y2="240" stroke="#0a0805" stroke-width="2"/>
  <rect x="900" y="240" width="120" height="40" fill="#1a1410" stroke="#0a0805" stroke-width="2" rx="4"/>
  <rect x="908" y="248" width="104" height="24" fill="#0a0a18" stroke="#0a0805" stroke-width="1"/>

  <!-- Floor mat hint -->
  <rect x="600" y="950" width="720" height="100" fill="#1a1410" stroke="#0a0805" stroke-width="1.5" stroke-opacity="0.6"/>
  <line x1="650" y1="970" x2="1270" y2="970" stroke="#0a0805" stroke-width="1" stroke-opacity="0.4"/>
  <line x1="650" y1="1000" x2="1270" y2="1000" stroke="#0a0805" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Subtle dust particles on windshield (outside) -->
  <g fill="#5d604c" fill-opacity="0.3">
    <circle cx="400" cy="320" r="1.5"/>
    <circle cx="700" cy="450" r="1.5"/>
    <circle cx="1100" cy="380" r="1.5"/>
    <circle cx="1500" cy="500" r="1.5"/>
  </g>
</svg>
