<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a4a3a"/>
      <stop offset="0.5" stop-color="#3a2f25"/>
      <stop offset="1" stop-color="#1f1810"/>
    </linearGradient>
    <linearGradient id="skWallAccent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ea93f" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#8ea93f" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="skLampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ce46" stop-opacity="0.85"/>
      <stop offset="0.4" stop-color="#f7ce46" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f7ce46" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b3d"/>
      <stop offset="0.6" stop-color="#3a2540"/>
      <stop offset="1" stop-color="#1a1018"/>
    </linearGradient>
    <linearGradient id="skFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2818"/>
      <stop offset="1" stop-color="#0a0604"/>
    </linearGradient>
  </defs>

  <!-- Back wall -->
  <rect width="1920" height="780" fill="url(#skWall)"/>

  <!-- Subtle olive paint accent (lower wall) -->
  <rect x="0" y="540" width="1920" height="240" fill="url(#skWallAccent)"/>

  <!-- Wall chair rail -->
  <line x1="0" y1="540" x2="1920" y2="540" stroke="#1f1810" stroke-width="3"/>
  <line x1="0" y1="548" x2="1920" y2="548" stroke="#5a4a3a" stroke-width="1" stroke-opacity="0.5"/>

  <!-- Floor -->
  <rect x="0" y="780" width="1920" height="300" fill="url(#skFloor)"/>
  <g stroke="#1f1810" stroke-width="1" stroke-opacity="0.6" fill="none">
    <line x1="240" y1="780" x2="320" y2="1080"/>
    <line x1="480" y1="780" x2="560" y2="1080"/>
    <line x1="720" y1="780" x2="800" y2="1080"/>
    <line x1="960" y1="780" x2="1040" y2="1080"/>
    <line x1="1200" y1="780" x2="1280" y2="1080"/>
    <line x1="1440" y1="780" x2="1520" y2="1080"/>
    <line x1="1680" y1="780" x2="1760" y2="1080"/>
  </g>

  <!-- Suburban night window (center-back) -->
  <g stroke="#0a0604" stroke-width="3">
    <rect x="780" y="160" width="360" height="380" fill="url(#skWindow)"/>
    <line x1="960" y1="160" x2="960" y2="540" stroke="#0a0604" stroke-width="2.5"/>
    <line x1="780" y1="350" x2="1140" y2="350" stroke="#0a0604" stroke-width="2.5"/>
  </g>

  <!-- Suburban night outside the window: distant house roofline + streetlight -->
  <g>
    <!-- House roof silhouettes (across bottom of window) -->
    <path d="M 790 460 L 820 430 L 860 460 L 900 425 L 950 460 L 1000 420 L 1050 460 L 1100 430 L 1130 460 L 1130 540 L 790 540 Z"
          fill="#1a1018" stroke="#0a0604" stroke-width="1.5" stroke-opacity="0.7"/>
    <!-- lit window in a house -->
    <rect x="845" y="475" width="20" height="22" fill="#f7ce46" opacity="0.7"/>
    <rect x="975" y="475" width="20" height="22" fill="#f7ce46" opacity="0.5"/>
    <!-- streetlight -->
    <line x1="1090" y1="540" x2="1090" y2="380" stroke="#0a0604" stroke-width="1.5"/>
    <circle cx="1090" cy="370" r="8" fill="#f7ce46" opacity="0.85"/>
    <ellipse cx="1090" cy="380" rx="50" ry="40" fill="#f7ce46" opacity="0.15"/>
  </g>

  <!-- Curtains (left and right of window) -->
  <g stroke="#0a0604" stroke-width="2">
    <path d="M 740 160 L 780 160 L 780 540 L 760 540 L 750 480 L 745 380 L 740 280 L 735 200 Z"
          fill="#3a2f25"/>
    <line x1="745" y1="220" x2="775" y2="220" stroke="#1f1810" stroke-width="1"/>
    <line x1="745" y1="300" x2="775" y2="300" stroke="#1f1810" stroke-width="1"/>
    <line x1="745" y1="380" x2="775" y2="380" stroke="#1f1810" stroke-width="1"/>
    <line x1="745" y1="460" x2="775" y2="460" stroke="#1f1810" stroke-width="1"/>

    <path d="M 1180 160 L 1140 160 L 1140 540 L 1160 540 L 1170 480 L 1175 380 L 1180 280 L 1185 200 Z"
          fill="#3a2f25"/>
    <line x1="1145" y1="220" x2="1175" y2="220" stroke="#1f1810" stroke-width="1"/>
    <line x1="1145" y1="300" x2="1175" y2="300" stroke="#1f1810" stroke-width="1"/>
    <line x1="1145" y1="380" x2="1175" y2="380" stroke="#1f1810" stroke-width="1"/>
    <line x1="1145" y1="460" x2="1175" y2="460" stroke="#1f1810" stroke-width="1"/>
  </g>

  <!-- Curtain rod -->
  <line x1="720" y1="150" x2="1200" y2="150" stroke="#0a0604" stroke-width="4"/>
  <circle cx="720" cy="150" r="6" fill="#1f1810" stroke="#0a0604" stroke-width="2"/>
  <circle cx="1200" cy="150" r="6" fill="#1f1810" stroke="#0a0604" stroke-width="2"/>

  <!-- Table lamp on side table (left of couch) - main warm glow -->
  <g>
    <!-- glow halo -->
    <ellipse cx="220" cy="600" rx="400" ry="280" fill="url(#skLampGlow)"/>
    <!-- lamp shade -->
    <path d="M 170 470 L 270 470 L 290 560 L 150 560 Z" fill="#d7e36f" opacity="0.85" stroke="#0a0604" stroke-width="2.5"/>
    <line x1="180" y1="490" x2="260" y2="490" stroke="#0a0604" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="183" y1="510" x2="257" y2="510" stroke="#0a0604" stroke-width="1" stroke-opacity="0.4"/>
    <line x1="186" y1="530" x2="254" y2="530" stroke="#0a0604" stroke-width="1" stroke-opacity="0.4"/>
    <!-- lamp base -->
    <rect x="210" y="560" width="20" height="40" fill="#3a2f25" stroke="#0a0604" stroke-width="2"/>
    <ellipse cx="220" cy="600" rx="30" ry="6" fill="#3a2f25" stroke="#0a0604" stroke-width="2"/>
  </g>

  <!-- Side table (small) -->
  <g stroke="#0a0604" stroke-width="2.5">
    <rect x="120" y="600" width="220" height="20" fill="#5a4a3a"/>
    <rect x="130" y="620" width="20" height="160" fill="#3a2f25"/>
    <rect x="310" y="620" width="20" height="160" fill="#3a2f25"/>
    <line x1="120" y1="700" x2="340" y2="700" stroke="#0a0604" stroke-width="2"/>
  </g>

  <!-- Couch silhouette (center, mid-century shape) -->
  <g stroke="#0a0604" stroke-width="2.5" stroke-linejoin="round">
    <!-- back -->
    <rect x="420" y="600" width="1080" height="140" fill="#3a3025" rx="12"/>
    <!-- cushions -->
    <rect x="440" y="610" width="200" height="120" fill="#4a3f30" rx="8"/>
    <rect x="650" y="610" width="200" height="120" fill="#4a3f30" rx="8"/>
    <rect x="860" y="610" width="200" height="120" fill="#4a3f30" rx="8"/>
    <rect x="1070" y="610" width="200" height="120" fill="#4a3f30" rx="8"/>
    <rect x="1280" y="610" width="200" height="120" fill="#4a3f30" rx="8"/>
    <!-- seat base -->
    <rect x="400" y="720" width="1120" height="60" fill="#2a2218" rx="6"/>
    <!-- legs (mid-century angled) -->
    <line x1="430" y1="780" x2="410" y2="830" stroke="#0a0604" stroke-width="4"/>
    <line x1="490" y1="780" x2="510" y2="830" stroke="#0a0604" stroke-width="4"/>
    <line x1="1410" y1="780" x2="1430" y2="830" stroke="#0a0604" stroke-width="4"/>
    <line x1="1490" y1="780" x2="1470" y2="830" stroke="#0a0604" stroke-width="4"/>
    <!-- arm rests -->
    <rect x="400" y="680" width="30" height="80" fill="#3a3025" rx="6"/>
    <rect x="1490" y="680" width="30" height="80" fill="#3a3025" rx="6"/>
  </g>

  <!-- Throw pillow accents on couch -->
  <g stroke="#0a0604" stroke-width="2">
    <rect x="470" y="640" width="60" height="60" fill="#8ea93f" opacity="0.75" rx="4"/>
    <rect x="1100" y="640" width="60" height="60" fill="#5a2a4a" opacity="0.8" rx="4"/>
    <rect x="1320" y="640" width="60" height="60" fill="#d7e36f" opacity="0.6" rx="4"/>
  </g>

  <!-- Coffee table (front of couch) -->
  <g stroke="#0a0604" stroke-width="2.5">
    <rect x="500" y="850" width="920" height="20" fill="#5a4a3a"/>
    <rect x="510" y="870" width="20" height="100" fill="#3a2f25"/>
    <rect x="1390" y="870" width="20" height="100" fill="#3a2f25"/>
    <line x1="500" y1="930" x2="1420" y2="930" stroke="#0a0604" stroke-width="2"/>
  </g>

  <!-- Items on coffee table -->
  <g stroke="#0a0604" stroke-width="2">
    <!-- book stack -->
    <rect x="600" y="820" width="100" height="14" fill="#5a2a4a"/>
    <rect x="595" y="830" width="110" height="14" fill="#d7e36f" opacity="0.75"/>
    <rect x="605" y="844" width="90" height="6" fill="#8ea93f" opacity="0.85"/>
    <!-- candle/mug -->
    <ellipse cx="820" cy="845" rx="20" ry="6" fill="#3a2f25"/>
    <path d="M 800 845 L 800 815 Q 800 808 810 808 L 830 808 Q 840 808 840 815 L 840 845" fill="#3a2f25"/>
    <!-- small bowl -->
    <ellipse cx="1000" cy="845" rx="50" ry="10" fill="#1f1810"/>
    <ellipse cx="1000" cy="843" rx="50" ry="10" fill="#3a2f25"/>
    <!-- magazine -->
    <rect x="1180" y="830" width="120" height="14" fill="#1f1810" stroke="#0a0604" stroke-width="1.5"/>
  </g>

  <!-- Floor lamp (right side) -->
  <g stroke="#0a0604" stroke-width="2.5">
    <path d="M 1680 480 L 1780 480 L 1800 560 L 1660 560 Z" fill="#3a2f25"/>
    <line x1="1730" y1="560" x2="1730" y2="880" stroke="#0a0604" stroke-width="3"/>
    <ellipse cx="1730" cy="880" rx="50" ry="8" fill="#3a2f25"/>
    <!-- light from floor lamp -->
    <ellipse cx="1730" cy="540" rx="300" ry="150" fill="#f7ce46" opacity="0.15"/>
  </g>

  <!-- Wall art (left) - abstract framed picture -->
  <g stroke="#0a0604" stroke-width="2.5">
    <rect x="100" y="220" width="180" height="220" fill="#1f1810"/>
    <rect x="115" y="235" width="150" height="190" fill="#5a2a4a" opacity="0.6"/>
    <rect x="135" y="280" width="50" height="50" fill="#f7ce46" opacity="0.7"/>
    <rect x="195" y="320" width="50" height="50" fill="#8ea93f" opacity="0.7"/>
  </g>

  <!-- Wall art (right) - another framed piece -->
  <g stroke="#0a0604" stroke-width="2.5">
    <rect x="1640" y="240" width="160" height="180" fill="#1f1810"/>
    <rect x="1655" y="255" width="130" height="150" fill="#3a2540" opacity="0.7"/>
    <circle cx="1720" cy="330" r="40" fill="#f7ce46" opacity="0.55"/>
  </g>

  <!-- Floor reflection of lamp glow -->
  <ellipse cx="220" cy="900" rx="200" ry="40" fill="#f7ce46" opacity="0.15"/>
  <ellipse cx="1730" cy="930" rx="180" ry="30" fill="#f7ce46" opacity="0.1"/>

  <!-- Baseboard -->
  <rect x="0" y="780" width="1920" height="6" fill="#1f1810"/>

  <!-- Subtle shadow under couch -->
  <ellipse cx="960" cy="850" rx="580" ry="14" fill="#0a0604" opacity="0.7"/>
</svg>
