    <!-- Porkpie hat brim (wide flat, extends past head outline) -->
    <ellipse cx="100" cy="56" rx="50" ry="4"/>
    <!-- Porkpie hat crown (low oval) -->
    <path d="M 73 56 Q 73 33 100 33 Q 127 33 127 56 Z"/>
  </g>
  <!-- Glasses cutouts (background color, 2 small circles near eye level) -->
  <circle cx="87" cy="82" r="5" fill="#a3b357"/>
  <circle cx="113" cy="82" r="5" fill="#a3b357"/>
