      <circle cx="100" cy="100" r="100"/>
    </clipPath>
  </defs>
  <circle cx="100" cy="100" r="100" fill="#a3b357"/>
  <g clip-path="url(#walterClip)" fill="#d7e36f">
    <!-- Narrow conservative suit shoulders -->
    <path d="M 35 200 L 35 168 Q 40 148 68 140 L 90 134 L 90 122 L 110 122 L 110 134 L 132 140 Q 160 148 165 168 L 165 200 Z"/>
    <!-- Head -->
    <ellipse cx="100" cy="85" rx="30" ry="32"/>
