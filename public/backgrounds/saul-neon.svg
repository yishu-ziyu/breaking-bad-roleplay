<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="saulWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2a4a"/>
      <stop offset="0.4" stop-color="#3a1f30"/>
      <stop offset="1" stop-color="#1f1218"/>
    </linearGradient>
    <radialGradient id="saulNeonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f7ce46" stop-opacity="0.7"/>
      <stop offset="0.3" stop-color="#f7ce46" stop-opacity="0.3"/>
      <stop offset="0.7" stop-color="#5a2a4a" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5a2a4a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="saulPinkGlow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ff7ab8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff7ab8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="saulFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1418"/>
      <stop offset="1" stop-color="#100808"/>
    </linearGradient>
    <linearGradient id="saulWindow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1b3d"/>
      <stop offset="1" stop-color="#0a0a18"/>
    </linearGradient>
  </defs>

  <!-- Back wall -->
  <rect width="1920" height="780" fill="url(#saulWall)"/>

  <!-- Floor -->
  <rect x="0" y="780" width="1920" height="300" fill="url(#saulFloor)"/>
  <line x1="0" y1="780" x2="1920" y2="780" stroke="#1f1218" stroke-width="2"/>

  <!-- Window frame (back wall, large) -->
  <g stroke="#0a0805" stroke-width="3">
    <rect x="280" y="120" width="1360" height="500" fill="url(#saulWindow)"/>
    <!-- window mullions -->
    <line x1="960" y1="120" x2="960" y2="620" stroke="#0a0805" stroke-width="2.5"/>
    <line x1="280" y1="370" x2="1640" y2="370" stroke="#0a0805" stroke-width="2.5"/>
    <!-- blinds (horizontal slats) -->
    <g stroke="#1a0a18" stroke-width="1.5" stroke-opacity="0.85">
      <line x1="285" y1="160" x2="1635" y2="160"/>
      <line x1="285" y1="190" x2="1635" y2="190"/>
      <line x1="285" y1="220" x2="1635" y2="220"/>
      <line x1="285" y1="250" x2="1635" y2="250"/>
      <line x1="285" y1="280" x2="1635" y2="280"/>
      <line x1="285" y1="310" x2="1635" y2="310"/>
      <line x1="285" y1="340" x2="1635" y2="340"/>
    </g>
  </g>

  <!-- Glowing neon rectangular sign (visible through window) -->
  <g>
    <!-- outer glow -->
    <rect x="700" y="260" width="520" height="160" fill="url(#saulNeonGlow)" opacity="0.9"/>
    <!-- inner glow -->
    <rect x="730" y="285" width="460" height="110" fill="#f7ce46" opacity="0.95"/>
    <!-- bright core (no text, just bright shape) -->
    <rect x="755" y="305" width="410" height="70" fill="#fff5b8" opacity="0.95"/>
    <!-- neon tube outline (broken segments) -->
    <g stroke="#fff5b8" stroke-width="3" fill="none" stroke-linecap="round">
      <line x1="730" y1="285" x2="1190" y2="285"/>
      <line x1="730" y1="395" x2="1190" y2="395"/>
      <line x1="730" y1="285" x2="730" y2="395"/>
      <line x1="1190" y1="285" x2="1190" y2="395"/>
    </g>
    <!-- small accent dot pattern (to suggest text without being readable) -->
    <g fill="#5a2a4a" opacity="0.7">
      <rect x="780" y="320" width="30" height="14" rx="3"/>
      <rect x="820" y="320" width="22" height="14" rx="3"/>
      <rect x="852" y="320" width="34" height="14" rx="3"/>
      <rect x="896" y="320" width="20" height="14" rx="3"/>
      <rect x="926" y="320" width="40" height="14" rx="3"/>
      <rect x="976" y="320" width="24" height="14" rx="3"/>
      <rect x="1010" y="320" width="32" height="14" rx="3"/>
      <rect x="1052" y="320" width="22" height="14" rx="3"/>
      <rect x="1084" y="320" width="38" height="14" rx="3"/>
    </g>
  </g>

  <!-- Pink spill from neon on walls -->
  <ellipse cx="960" cy="340" rx="700" ry="200" fill="url(#saulPinkGlow)"/>

  <!-- Desk silhouette (foreground) -->
  <g stroke="#0a0805" stroke-width="2.5" stroke-linejoin="round">
    <!-- desk top -->
    <rect x="200" y="680" width="1520" height="40" fill="#1a0a10"/>
    <!-- desk front panel -->
    <rect x="240" y="720" width="1440" height="220" fill="#100608"/>
    <!-- desk legs -->
    <rect x="220" y="720" width="20" height="280" fill="#0a0408"/>
    <rect x="1680" y="720" width="20" height="280" fill="#0a0408"/>
    <!-- desk drawer lines -->
    <line x1="700" y1="720" x2="700" y2="940" stroke="#0a0408" stroke-width="1.5"/>
    <line x1="1220" y1="720" x2="1220" y2="940" stroke="#0a0408" stroke-width="1.5"/>
    <!-- drawer pulls -->
    <circle cx="450" cy="830" r="6" fill="#f7ce46" opacity="0.6"/>
    <circle cx="960" cy="830" r="6" fill="#f7ce46" opacity="0.6"/>
    <circle cx="1470" cy="830" r="6" fill="#f7ce46" opacity="0.6"/>
  </g>

  <!-- Office chair (center) -->
  <g stroke="#0a0408" stroke-width="2.5" stroke-linejoin="round">
    <rect x="820" y="780" width="280" height="120" fill="#0a0408" rx="8"/>
    <line x1="820" y1="800" x2="1100" y2="800" stroke="#1a0a10" stroke-width="2"/>
    <line x1="960" y1="900" x2="960" y2="1000" stroke="#0a0408" stroke-width="6"/>
    <ellipse cx="960" cy="1020" rx="80" ry="14" fill="#0a0408"/>
  </g>

  <!-- Lamps on desk -->
  <g stroke="#0a0408" stroke-width="2">
    <!-- left desk lamp -->
    <path d="M 320 680 L 300 600 L 360 600 L 340 680 Z" fill="#3a1f30"/>
    <ellipse cx="330" cy="600" rx="40" ry="12" fill="#f7ce46" opacity="0.85"/>
    <ellipse cx="330" cy="600" rx="60" ry="18" fill="#f7ce46" opacity="0.25"/>
    <!-- right desk lamp -->
    <path d="M 1600 680 L 1580 600 L 1640 600 L 1620 680 Z" fill="#3a1f30"/>
    <ellipse cx="1610" cy="600" rx="40" ry="12" fill="#f7ce46" opacity="0.85"/>
    <ellipse cx="1610" cy="600" rx="60" ry="18" fill="#f7ce46" opacity="0.25"/>
  </g>

  <!-- Wall picture frames (left & right of window) -->
  <g stroke="#0a0408" stroke-width="2">
    <rect x="100" y="280" width="140" height="180" fill="#1a0a10"/>
    <rect x="110" y="290" width="120" height="160" fill="#2a1418"/>
    <line x1="170" y1="280" x2="170" y2="240" stroke="#0a0408" stroke-width="2"/>

    <rect x="1680" y="280" width="140" height="180" fill="#1a0a10"/>
    <rect x="1690" y="290" width="120" height="160" fill="#2a1418"/>
    <line x1="1750" y1="280" x2="1750" y2="240" stroke="#0a0408" stroke-width="2"/>
  </g>

  <!-- Floor reflection of neon -->
  <ellipse cx="960" cy="900" rx="800" ry="60" fill="#f7ce46" opacity="0.12"/>
  <ellipse cx="960" cy="950" rx="500" ry="30" fill="#ff7ab8" opacity="0.1"/>
</svg>
