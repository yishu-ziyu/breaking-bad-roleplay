[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build && cd backend && /usr/bin/python3 -m ensurepip && /usr/bin/python3 -m pip install -r requirements.txt"

[deploy]
startCommand = "sh -c 'cd backend && uvicorn main:app --host 0.0.0.0 --port ${PORT:-8080}'"
healthcheckPath = "/api/health"
